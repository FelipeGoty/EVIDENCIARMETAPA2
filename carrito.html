<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Detalles y opciones del producto en PCEL2." />
    <title>Detalle de producto | PCEL2</title>
    <link rel="stylesheet" href="estilo.css" />
    <script src="carrito-widget.js" defer></script>
    <script src="carrito.js" defer></script>
  </head>
  <body>
    <div class="topline">
      <div class="page-width topline-inner">
        <span>PCEL2 &middot; DETALLES DEL PRODUCTO</span>
        <a href="hero.html">Volver a inicio</a>
      </div>
    </div>

    <header class="site-header carrito-site-header">
      <div class="page-width header-main">
        <a class="brand" href="hero.html" aria-label="PCEL2, inicio">PCEL<span>2</span></a>
        <p class="brand-note">Información y opciones del producto</p>
        <a class="header-cta" href="Productos.html">Regresar al catálogo <span aria-hidden="true">&larr;</span></a>
      </div>
      <nav class="category-nav" aria-label="Navegación principal">
        <div class="page-width nav-inner">
          <a href="hero.html">Inicio</a>
          <a href="Productos.html">Todos los productos</a>
        </div>
      </nav>
    </header>

    <main class="page-width detalle-pagina">
      <nav class="breadcrumbs" aria-label="Ruta de navegación">
        <a href="hero.html">Inicio</a><span aria-hidden="true">/</span>
        <a href="Productos.html">Productos</a><span aria-hidden="true">/</span>
        <span id="detalle-miga">Producto</span>
      </nav>

      <p class="detalle-error" id="detalle-error" role="alert" hidden></p>

      <section class="detalle-producto" id="detalle-producto" aria-labelledby="detalle-nombre" hidden>
        <div class="detalle-galeria">
          <div class="detalle-imagen-marco">
            <img id="detalle-imagen" class="detalle-imagen" alt="" />
            <button class="detalle-carrusel-control anterior" id="imagen-anterior" type="button" aria-label="Ver imagen anterior">&lsaquo;</button>
            <span class="detalle-carrusel-indicador" id="imagen-indicador" aria-live="polite"></span>
            <button class="detalle-carrusel-control siguiente" id="imagen-siguiente" type="button" aria-label="Ver imagen siguiente">&rsaquo;</button>
          </div>
        </div>

        <div class="detalle-informacion">
          <p class="detalle-categoria" id="detalle-categoria"></p>
          <h1 id="detalle-nombre"></h1>
          <p class="detalle-descripcion" id="detalle-descripcion"></p>

          <label class="detalle-opcion-label" for="detalle-opcion">Elige una opción</label>
          <select class="detalle-opcion" id="detalle-opcion"></select>

          <p class="detalle-precio" id="detalle-precio"></p>
          <p class="detalle-stock" id="detalle-stock"></p>
          <button class="agregar-carrito" id="agregar-carrito" type="button" disabled>Agregar al carrito</button>
          <p class="carrito-feedback" id="carrito-feedback" aria-live="polite"></p>

          <div class="detalle-especificaciones">
            <h2>Información del producto</h2>
            <ul id="detalle-lista"></ul>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="page-width footer-inner">
        <a class="brand footer-brand" href="hero.html">PCEL<span>2</span></a>
        <p>Hola profe llevo como 4 horas haciendo esto.</p>
        <a href="Productos.html">Volver al catálogo <span aria-hidden="true">&rarr;</span></a>
      </div>
    </footer>
  </body>
</html>
